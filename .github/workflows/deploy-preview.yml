name: Deploy PAI Word preview

on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-preview.yml']
  workflow_dispatch:
    inputs:
      v22_source_sha:
        description: 'PAI Word V2.2 source commit SHA'
        required: true
        type: string
        default: '1e85f3e90b9ea11fd9f0c75d21559e0ef2f24f86'

permissions:
  contents: read

concurrency:
  group: preview-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout complete development source
        uses: actions/checkout@v4
        with:
          repository: TJPAI/pai-word
          ref: core20k-rebuild-v1
          path: source
          fetch-depth: 1
          persist-credentials: false
      - name: Record source commit
        id: source
        working-directory: source
        run: |
          SOURCE_SHA=$(git rev-parse HEAD)
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "Source: TJPAI/pai-word@core20k-rebuild-v1 ($SOURCE_SHA)" >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare isolated static preview
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          mkdir -p site
          rsync -a --exclude='.git' --exclude='.github' --exclude='CNAME' source/ site/
          test -f site/rebuild-preview/index.html
          printf '%s\n' "$SOURCE_SHA" > site/preview-source-sha.txt
          touch site/.nojekyll
          cat > site/index.html <<'HTML'
          <!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0;url=./rebuild-preview/"><title>PAI Word Preview</title></head><body><a href="./rebuild-preview/">打开 PAI Word 独立预览</a><script>location.replace('./rebuild-preview/' + location.search + location.hash)</script></body></html>
          HTML
      - name: Checkout complete performance source
        uses: actions/checkout@v4
        with:
          repository: TJPAI/pai-word
          ref: home-perf-safe-load-20261022
          path: perf-source
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare isolated performance preview
        run: |
          PERF_SHA=$(git -C perf-source rev-parse HEAD)
          test ! -e site/perf-preview
          mkdir -p site/perf-preview
          rsync -a --exclude='.git' --exclude='.github' --exclude='CNAME' perf-source/ site/perf-preview/
          test -f site/perf-preview/rebuild-preview/index.html
          printf '%s\n' "$PERF_SHA" > site/perf-preview/preview-source-sha.txt
          echo "Performance source: TJPAI/pai-word@home-perf-safe-load-20261022 ($PERF_SHA)" >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout isolated teaching-answer source
        uses: actions/checkout@v4
        with:
          repository: TJPAI/pai-word
          ref: teaching-answer-isolated-preview-20261025
          path: teaching-source
          fetch-depth: 1
          persist-credentials: false
      - name: Stage isolated teaching-answer preview
        run: |
          TEACHING_SHA=$(git -C teaching-source rev-parse HEAD)
          test ! -e site/teaching-preview
          mkdir -p site/teaching-preview
          rsync -a --exclude='.git' --exclude='.github' --exclude='CNAME' teaching-source/ site/teaching-preview/
          test -f site/teaching-preview/rebuild-preview/index.html
          printf '%s\n' "$TEACHING_SHA" > site/teaching-preview/preview-source-sha.txt
          echo "Teaching preview source SHA: $TEACHING_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout Scene500 E5 staging builder
        uses: actions/checkout@v4
        with:
          repository: TJPAI/pai-word
          ref: scene500-ai-training-pilot
          path: e5-source
          fetch-depth: 1
          persist-credentials: false
      - name: Stage Scene500 E5 runtime (pinned release ZIP)
        run: |
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 600 \
            "https://github.com/TJPAI/pai-word-preview/releases/download/scene500-e5-v1.6-test/scene500-e5-v16-patched.zip" \
            --output runtime.zip
          python3 e5-source/experiments/scene500-ai-training/v1.6/prepare-pages.py runtime.zip site/scene500-e5
          test -f site/scene500-e5/index.html
          echo "Scene500 E5 staged at /scene500-e5/ (ZIP + index + model SHA-256 verified by prepare-pages.py)" >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout B184 isolated recognition source (pinned commit)
        uses: actions/checkout@v4
        with:
          repository: TJPAI/pai-word
          ref: 393651b8e9089956502ea9c97f6aca3d5415f332
          path: b184-source
          fetch-depth: 1
          persist-credentials: false
      - name: Stage B184 isolated recognition preview
        run: |
          test ! -e site/b184-recognition
          mkdir -p site/b184-recognition
          rsync -a --exclude='.git' b184-source/rebuild-preview/b184-recognition/ site/b184-recognition/
          test -f site/b184-recognition/index.html
          test -f site/b184-recognition/contract.mjs
          test -f site/b184-recognition/candidates-b184.jsonl
          printf '%s\n' '393651b8e9089956502ea9c97f6aca3d5415f332' > site/b184-recognition/preview-source-sha.txt
      
      - name: Validate V2.2 source SHA
        env:
          V22_SHA: ${{ inputs.v22_source_sha }}
        shell: bash
        run: |
          if [[ ! "$V22_SHA" =~ ^[a-fA-F0-9]{40}$ ]]; then
            echo "Invalid V2.2 source SHA"
            exit 1
          fi
          
      - name: Checkout V2.2 integration candidate (fixed source commit)
        uses: actions/checkout@v4
        with:
          repository: TJPAI/pai-word
          ref: ${{ inputs.v22_source_sha }}
          path: v22-source
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node for V2.2 integration QA
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify V2.2 source and materialize Chinese V0.10.1
        working-directory: v22-source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ inputs.v22_source_sha }}'
          node scripts/materialize-zh-core20k-v0101.mjs
      - name: Verify English Core20K adapter
        working-directory: v22-source
        run: node scripts/core20k-unified-runtime-test.mjs data/core20k-runtime.json.gz
      - name: Verify original answer page
        working-directory: v22-source
        run: node tools/answer-enrichment/test-standard-answer-cleanup.mjs
      - name: Verify four-line integration contract
        working-directory: v22-source
        run: node tools/integration/test-four-line-contract.mjs
      - name: Verify S113 Staging remains inactive
        working-directory: v22-source
        run: node tools/integration/test-s113-staging-overlay.mjs
      - name: Verify Scene500 bridge
        working-directory: v22-source
        run: node tools/integration/test-four-line-scene-bridge.mjs
      - name: Stage verified V2.2 integration candidate
        shell: bash
        run: |
          set -euo pipefail
          test ! -e site/v22-integration
          mkdir -p site/v22-integration
          rsync -a --exclude='.git' --exclude='.github' --exclude='CNAME' v22-source/ site/v22-integration/
          test -f site/v22-integration/rebuild-preview/index.html
          cmp v22-source/scene500-recommendation/zh-core20k-v0101-scene500-runtime.json site/v22-integration/scene500-recommendation/zh-core20k-v0101-scene500-runtime.json
          git -C v22-source rev-parse HEAD > site/v22-integration/preview-source-sha.txt
          echo 'V2.2 candidate (NOT stable): /v22-integration/rebuild-preview/index.html' >> "$GITHUB_STEP_SUMMARY"
          echo 'V2.2 source: ${{ inputs.v22_source_sha }}; all six QA gates PASS; S113 7 records remain inactive Staging.' >> "$GITHUB_STEP_SUMMARY"
      - name: Require all existing previews byte-identical to deployed run 40288331578
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('site')
          rows = []
          for path in root.rglob('*'):
              relative = path.relative_to(root).as_posix()
              if relative == 'v22-integration' or relative.startswith('v22-integration/'):
                  continue
              if path.is_file():
                  rows.append((relative, hashlib.sha256(path.read_bytes()).hexdigest()))
          rows.sort()
          payload = ''.join(f'{digest}  {path}\n' for path, digest in rows).encode()
          actual = hashlib.sha256(payload).hexdigest()
          expected = 'b8875e51685aba3e6144417b3270a53516c3b9df0bd5a0556307ba4f62d61f14'
          assert len(rows) == 2158 and actual == expected, f'Existing preview drift: {len(rows)} files, {actual}; deployment blocked'
          print(f'PASS all {len(rows)} existing files unchanged, including perf-preview: {actual}')
          PY
          echo 'PASS existing previews: all 2158 file paths and SHA256 contents unchanged from deployed run 40288331578.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy preview to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Deployment summary
        env:
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "Preview: ${PAGE_URL}rebuild-preview/" >> "$GITHUB_STEP_SUMMARY"
          echo "Source SHA: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
